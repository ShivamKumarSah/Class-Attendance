<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Class Attendance Marker</title>
  <meta name="description" content="Quickly create and copy class attendance messages, manage your student list, and submit attendance via Google Forms.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #172033;
      --muted: #667085;
      --blue: #315efb;
      --blue-light: #eef2ff;
      --line: #e4e7ec;
      --bg: #f0f4ff;
      --card-bg: #ffffff;
      --success: #067647;
      --danger-bg: #fff0ef;
      --danger: #b42318;
      --radius: 16px;
      --shadow: 0 4px 24px #315efb12, 0 1px 4px #17203308;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    .topbar {
      background: linear-gradient(135deg, #1a2fcc 0%, #315efb 60%, #6c8fff 100%);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: 0 2px 16px #315efb30;
    }

    .topbar-icon {
      width: 40px; height: 40px;
      background: rgba(255,255,255,0.18);
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 1.3rem;
    }

    .topbar h1 { font-size: 1.25rem; font-weight: 700; color: #fff; letter-spacing: -.02em; }
    .topbar p  { font-size: .82rem; color: rgba(255,255,255,0.75); margin-top: 2px; }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
      gap: 24px;
      max-width: 1280px;
      margin: 0 auto;
      padding: 28px 28px 48px;
      align-items: start;
    }

    .left-col { display: flex; flex-direction: column; gap: 18px; }

    .right-col { position: sticky; top: 20px; }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .form-card-header {
      padding: 16px 20px 12px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(135deg, #f8faff, #eef2ff);
    }

    .form-card-header h2 { font-size: .95rem; font-weight: 700; color: var(--ink); }
    .form-card-header p  { font-size: .8rem; color: var(--muted); margin-top: 4px; }

    .iframe-wrapper iframe {
      width: 100%; height: 560px; border: none; display: block;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      transition: box-shadow .2s;
    }

    .card:hover { box-shadow: 0 6px 32px #315efb1a, 0 2px 8px #17203310; }

    .card-title {
      font-size: .82rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .07em;
      color: var(--blue); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }

    .card-title .badge {
      background: var(--blue-light); color: var(--blue);
      border-radius: 50%; width: 22px; height: 22px;
      display: grid; place-items: center;
      font-size: .75rem; font-weight: 800;
    }

    label { display: block; font-weight: 600; font-size: .88rem; margin-bottom: 6px; color: #344054; }

    input, select, button { font: inherit; }

    input, select {
      width: 100%; min-height: 44px;
      border: 1.5px solid #cfd5df; border-radius: 10px;
      padding: 9px 12px; background: #fafbff; color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus, select:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px #315efb20; background: #fff;
    }

    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }

    button {
      border: 0; border-radius: 10px; padding: 10px 16px;
      font-weight: 700; cursor: pointer;
      transition: transform .12s, box-shadow .12s, filter .12s;
    }

    button:active { transform: scale(.97); }
    button:focus-visible { outline: 3px solid #315efb55; outline-offset: 2px; }

    .btn-primary {
      background: linear-gradient(135deg, #315efb, #1a45d8);
      color: white; width: 100%; min-height: 46px;
      box-shadow: 0 2px 10px #315efb40;
    }

    .btn-primary:hover { filter: brightness(1.08); box-shadow: 0 4px 16px #315efb55; }

    .btn-secondary { background: var(--blue-light); color: #2443b8; white-space: nowrap; }
    .btn-secondary:hover { background: #dde6ff; }

    .btn-delete { background: var(--danger-bg); color: var(--danger); padding: 6px 10px; font-size: .82rem; }
    .btn-delete:hover { background: #ffdcda; }

    .student-list { margin-bottom: 14px; }

    .student-row {
      display: flex; align-items: center;
      justify-content: space-between; gap: 12px;
      padding: 9px 0; border-bottom: 1px solid #f0f2f5;
      animation: fadeSlide .2s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .student-row:last-child { border-bottom: 0; }

    .student-name {
      overflow-wrap: anywhere; font-size: .92rem; font-weight: 500;
      display: flex; align-items: center; gap: 8px;
    }

    .student-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, #315efb, #6c8fff);
      color: white; font-size: .78rem; font-weight: 800;
      display: grid; place-items: center; flex-shrink: 0;
      text-transform: uppercase;
    }

    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 14px; }

    .empty-state { color: var(--muted); font-size: .88rem; padding: 6px 0 4px; }

    .message-box {
      white-space: pre-line; overflow-wrap: anywhere;
      background: #f8faff; border: 1.5px solid #dde6ff;
      border-radius: 10px; padding: 16px;
      min-height: 108px; line-height: 1.8;
      font-size: .93rem; color: var(--ink);
    }

    .message-actions { display: grid; gap: 9px; margin-top: 12px; }

    .status {
      min-height: 1.3em; font-size: .86rem;
      margin-top: 10px; font-weight: 500; transition: color .2s;
    }

    .status.ok  { color: var(--success); }
    .status.err { color: var(--danger); }

    .count-pill {
      background: var(--blue-light); color: var(--blue);
      border-radius: 100px; padding: 2px 8px;
      font-size: .75rem; font-weight: 700; margin-left: 4px;
    }

    .response-link {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: .82rem; color: var(--blue); text-decoration: none;
      margin-top: 10px; font-weight: 600;
    }

    .response-link:hover { text-decoration: underline; }

    @media (max-width: 820px) {
      .layout { grid-template-columns: 1fr; padding: 18px 16px 40px; gap: 18px; }
      .right-col { position: static; order: -1; }
      .iframe-wrapper iframe { height: 480px; }
    }

    @media (max-width: 480px) {
      .topbar { padding: 14px 16px; }
      .topbar h1 { font-size: 1.05rem; }
      .card { padding: 16px; }
      .add-row { grid-template-columns: 1fr; }
      .iframe-wrapper iframe { height: 420px; }
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="topbar-icon">📋</div>
    <div>
      <h1>Class Message Marker</h1>
      <p>Select a student, enter the topic, and copy your class message.</p>
    </div>
  </div>

  <div class="layout">

    <div class="left-col">

      <section class="card">
        <div class="card-title"><span class="badge">1</span> Create Class Message</div>
        <div class="field">
          <label for="studentSelect">Student</label>
          <select id="studentSelect"></select>
        </div>
        <div class="field">
          <label for="topicInput">Class topic</label>
          <input id="topicInput" maxlength="300" placeholder="e.g. Python functions">
        </div>
        <button id="generateBtn" class="btn-primary" type="button">⚡ Generate message</button>
      </section>

      <section class="card">
        <div class="card-title"><span class="badge">2</span> Copy Message</div>
        <div id="messageBox" class="message-box" aria-live="polite">Date - —
Topic - —
Student - —
1hr</div>
        <div class="message-actions">
          <button id="copyBtn" class="btn-primary" type="button">📋 Copy message</button>
        </div>
        <div id="statusMsg" class="status" role="status"></div>
        <a class="response-link" href="https://docs.google.com/spreadsheets/d/1TsWQ1O-PNI-wQqCKsjBZxsIOu_5hKK14BAseC4OCZzk/edit?usp=sharing" target="_blank" rel="noopener">
          📊 View Response Data
        </a>
      </section>

      <section class="card">
        <div class="card-title">
          <span class="badge">3</span>
          Students
          <span class="count-pill" id="studentCount">0</span>
        </div>
        <div class="student-list" id="studentList" aria-live="polite"></div>
        <div class="field" style="margin-bottom:0">
          <label for="newStudent">Add a student</label>
          <div class="add-row">
            <input id="newStudent" maxlength="80" placeholder="Student name" autocomplete="off">
            <button id="addStudentBtn" class="btn-secondary" type="button">+ Add</button>
          </div>
        </div>
      </section>

    </div>

    <div class="right-col">
      <div class="form-card">
        <div class="form-card-header">
          <h2>📝 Attendance Form</h2>
          <p>Fill in attendance details after generating your message.</p>
        </div>
        <div class="iframe-wrapper">
          <iframe
            src="https://docs.google.com/forms/d/e/1FAIpQLScOHvoJRXyP42SSYyESRbYiifmFu-U418USV4LUDKbTIxE7MQ/viewform?embedded=true"
            frameborder="0" marginheight="0" marginwidth="0"
            title="Attendance Form" loading="lazy">Loading…</iframe>
        </div>
      </div>
    </div>

  </div>

  <script>
    (() => {
      const STORAGE_KEY = 'classmaker_students_v1';

      function loadStudents() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : null;
          return Array.isArray(parsed) ? parsed : ['Dheemanth', 'Eshaan', 'Swaran'];
        } catch { return ['Dheemanth', 'Eshaan', 'Swaran']; }
      }

      function saveStudents() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(students)); } catch {}
      }

      let students = loadStudents();

      const listEl      = document.getElementById('studentList');
      const selectEl    = document.getElementById('studentSelect');
      const nameInput   = document.getElementById('newStudent');
      const topicInput  = document.getElementById('topicInput');
      const messageBox  = document.getElementById('messageBox');
      const statusMsg   = document.getElementById('statusMsg');
      const countPill   = document.getElementById('studentCount');
      let generated     = '';

      function setStatus(msg, type = 'ok') {
        statusMsg.textContent = msg;
        statusMsg.className = 'status ' + type;
      }

      function initials(name) {
        return name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase();
      }

      function renderStudents() {
        const prevSelected = selectEl.value;
        listEl.innerHTML = '';

        if (!students.length) {
          const em = document.createElement('div');
          em.className = 'empty-state';
          em.textContent = '🎓 No students yet — add one below.';
          listEl.appendChild(em);
        } else {
          students.forEach((name, idx) => {
            const row = document.createElement('div');
            row.className = 'student-row';

            const nameEl = document.createElement('span');
            nameEl.className = 'student-name';
            nameEl.innerHTML = '<span class="student-avatar">' + initials(name) + '</span>' + name;

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.type = 'button';
            delBtn.textContent = 'Delete';
            delBtn.setAttribute('aria-label', 'Delete ' + name);
            delBtn.addEventListener('click', () => {
              students.splice(idx, 1);
              saveStudents();
              renderStudents();
              setStatus(name + ' removed from the list.');
            });

            row.append(nameEl, delBtn);
            listEl.appendChild(row);
          });
        }

        countPill.textContent = students.length;
        selectEl.innerHTML = '';

        if (!students.length) {
          const opt = document.createElement('option');
          opt.value = '';
          opt.textContent = 'Add a student first';
          selectEl.appendChild(opt);
          selectEl.disabled = true;
        } else {
          selectEl.disabled = false;
          students.forEach(name => {
            const opt = document.createElement('option');
            opt.value = name;
            opt.textContent = name;
            selectEl.appendChild(opt);
          });
          selectEl.value = students.includes(prevSelected) ? prevSelected : students[0];
        }
      }

      function addStudent() {
        const name = nameInput.value.trim();
        if (!name) { setStatus('Enter a student name first.', 'err'); nameInput.focus(); return; }
        if (students.some(s => s.toLowerCase() === name.toLowerCase())) {
          setStatus('That student is already in the list.', 'err'); nameInput.focus(); return;
        }
        students.push(name);
        saveStudents();
        nameInput.value = '';
        renderStudents();
        selectEl.value = name;
        setStatus(name + ' added ✓');
        nameInput.focus();
      }

      function generateMessage() {
        const student = selectEl.value;
        const topic   = topicInput.value.trim();
        if (!student) { setStatus('Please add and select a student.', 'err'); return; }
        if (!topic)   { setStatus('Enter the class topic first.', 'err'); topicInput.focus(); return; }
        const date = new Date().toLocaleDateString('en-GB', {
          day: '2-digit', month: '2-digit', year: 'numeric'
        });
        generated = 'Date - ' + date + '\nTopic - ' + topic + '\nStudent - ' + student + '\n1hr';
        messageBox.textContent = generated;
        setStatus('Message generated. Ready to copy ✓');
      }

      async function copyMessage() {
        if (!generated) { setStatus('Generate a message first.', 'err'); return; }
        try {
          await navigator.clipboard.writeText(generated);
          setStatus('Copied! You can paste the message anywhere ✓');
        } catch {
          const area = document.createElement('textarea');
          area.value = generated;
          area.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
          document.body.appendChild(area);
          area.select();
          const ok = document.execCommand('copy');
          area.remove();
          setStatus(ok ? 'Copied! ✓' : 'Copy blocked — please select and copy manually.', ok ? 'ok' : 'err');
        }
      }

      document.getElementById('addStudentBtn').addEventListener('click', addStudent);
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') addStudent(); });
      document.getElementById('generateBtn').addEventListener('click', generateMessage);
      document.getElementById('copyBtn').addEventListener('click', copyMessage);

      renderStudents();
    })();
  </script>

</body>
</html>
